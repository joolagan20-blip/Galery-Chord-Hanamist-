<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0756d9">
<title>Hanamist Chord Gallery</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{
  background:#f8fbff;
  color:#102b5c;
  overflow-x:hidden;
}
.page{
  min-height:100vh;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 10% 32%, rgba(45,122,240,.12) 0 55px, transparent 56px),
    radial-gradient(circle at 94% 56%, rgba(45,122,240,.10) 0 70px, transparent 71px),
    linear-gradient(180deg,#eef7ff 0%,#ffffff 48%,#f4f9ff 100%);
}
.top-wave{
  position:absolute;left:-8%;right:-8%;top:-80px;height:330px;
  background:linear-gradient(145deg,#2f7cf1 0%,#0752bd 48%,#062c83 100%);
  border-radius:0 0 55% 25%;
  transform:rotate(-3deg);
  box-shadow:0 12px 30px rgba(8,69,165,.18);
}
.top-wave:after{
  content:"";position:absolute;left:0;right:0;bottom:18px;height:95px;
  background:#155fc9;opacity:.9;border-radius:50% 45% 0 0/65% 60% 0 0;
  transform:rotate(2deg);
}
.content{position:relative;z-index:2;width:min(760px,94vw);margin:auto;padding:42px 0 30px}
.brand{text-align:center;color:#fff;margin-top:5px}
.brand-main{
  font-family:"Brush Script MT","Segoe Script",cursive;
  font-size:clamp(58px,11vw,104px);font-weight:700;line-height:.9;
  text-shadow:4px 5px 0 #092b67,0 0 18px rgba(255,255,255,.25);
  letter-spacing:-2px;
}
.brand-main:before{content:"♛";color:#ffc62e;font-family:Arial;font-size:.42em;vertical-align:top;margin-right:8px;text-shadow:none}
.brand-sub{
  display:inline-block;margin-top:8px;padding:4px 18px;
  font-size:clamp(25px,4.8vw,42px);font-weight:800;font-style:italic;
  text-shadow:2px 3px 0 #092b67;
}
.note{position:absolute;color:#72b9ff;font-size:44px;opacity:.95}
.n1{right:7%;top:88px} .n2{left:3%;top:210px;font-size:34px}
.guitar{position:absolute;right:4%;top:65px;font-size:70px;color:#fff;transform:rotate(-12deg);opacity:.95}
.hero{text-align:center;margin-top:105px}
.hero h1{
  font-size:clamp(30px,6vw,56px);line-height:1.08;font-weight:900;
  font-style:italic;color:#112f67;
}
.hero h1 span{display:block;color:#176be7;margin-top:3px}
.spark{color:#ffbf24;font-size:28px;margin:0 10px}
.qr-card{
  width:min(570px,88vw);margin:32px auto 34px;padding:20px 20px 24px;
  background:rgba(255,255,255,.96);border-radius:34px;
  box-shadow:0 16px 42px rgba(20,75,155,.20);
  position:relative;
}
.qris-label{font-size:30px;font-weight:900;letter-spacing:-2px;color:#111;margin-bottom:10px}
.qr-card img{
  width:100%;display:block;background:#fff;border-radius:24px;
  image-rendering:auto;
}
.qr-hint{font-size:15px;color:#667b9d;margin-top:11px}
.cta-text{text-align:center;font-size:clamp(25px,5vw,42px);font-weight:900;font-style:italic;color:#102e64;line-height:1.05}
.cta-text span{display:block;color:#166be7;margin-top:4px}
.cta{
  display:flex;align-items:center;justify-content:center;gap:15px;
  width:min(560px,88vw);margin:26px auto 34px;padding:18px 28px;
  border-radius:60px;text-decoration:none;color:#fff;
  background:linear-gradient(135deg,#2b8cff,#0759e8 55%,#1745c7);
  border:3px solid rgba(255,255,255,.55);
  box-shadow:0 12px 28px rgba(13,91,220,.35),inset 0 2px 3px rgba(255,255,255,.35);
  font-size:clamp(22px,4vw,34px);font-weight:900;
  transition:.2s transform,.2s box-shadow;
}
.cta:hover{transform:translateY(-3px);box-shadow:0 17px 34px rgba(13,91,220,.42)}
.cta:active{transform:scale(.98)}
.hand{font-size:42px}
.arrow{font-size:40px}
.features{
  display:grid;grid-template-columns:repeat(4,1fr);gap:12px;
  width:min(680px,92vw);margin:0 auto 20px;
}
.feature{text-align:center;font-size:12px;font-weight:800;color:#153c7b}
.icon{
  width:48px;height:48px;border-radius:50%;margin:0 auto 7px;
  display:grid;place-items:center;background:#125bc7;color:#fff;font-size:23px;
  box-shadow:0 5px 13px rgba(16,86,194,.25);
}
.bottom-wave{
  height:95px;margin-top:20px;
  background:#1671e8;
  border-radius:55% 55% 0 0/75% 75% 0 0;
  transform:translateY(45px) rotate(-2deg) scale(1.1);
}
@media(max-width:520px){
  .content{padding-top:30px}
  .hero{margin-top:88px}
  .qr-card{padding:14px 14px 18px;border-radius:25px}
  .qris-label{font-size:25px}
  .features{gap:5px}
  .feature{font-size:10px}
  .icon{width:42px;height:42px;font-size:20px}
  .note,.guitar{opacity:.5}
}
</style>
</head>
